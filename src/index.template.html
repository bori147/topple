<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOPPLE: today's tower</title>
<meta name="description" content="Everyone gets the same 20 blocks today. Build the tallest tower before it falls.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#D6E6F0;--ink:#1E2A36;--muted:#5E7080;--plat:#3A4756;--card:#FFFFFF;--line:rgba(30,42,54,.14);
  --cobalt:#2D5BD7;--sun:#F2B630;--mint:#2FAE7E;--violet:#8E5BE0;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;--ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#132131;--ink:#EAF1F7;--muted:#93A5B6;--plat:#5B6B7C;--card:#1C2C3D;--line:rgba(234,241,247,.16)}}
:root[data-theme="dark"]{--sky:#132131;--ink:#EAF1F7;--muted:#93A5B6;--plat:#5B6B7C;--card:#1C2C3D;--line:rgba(234,241,247,.16)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--sky);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;pointer-events:none}
.tag{font-weight:700;font-size:15px}
.tag small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.height{font-family:var(--display);font-weight:800;font-size:clamp(44px,12vw,72px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:center}
.height span{font-size:.38em;font-weight:500;margin-left:.15em}
.right{justify-self:end;text-align:right;display:flex;gap:10px;align-items:center}
.left{font-weight:700;font-size:15px}
.left small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.iconbtn{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none}
.next{pointer-events:none;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px 8px 4px;text-align:center;font-size:12px;color:var(--muted)}
.next canvas{display:block;width:64px;height:52px}
.hint{flex:1;text-align:center;font-size:14px;color:var(--muted);padding-bottom:8px;transition:opacity .4s}
.rot{pointer-events:auto;width:72px;height:72px;border-radius:50%;border:none;background:var(--ink);color:var(--sky);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.rot:active{transform:scale(.94)}
.shout{position:fixed;left:0;right:0;top:38%;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(40px,13vw,96px);letter-spacing:-.02em;pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s}
.shout.on{opacity:1;transform:scale(1)}
.sheet{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(19,33,49,.28)}
.sheet.on{display:flex}
.card{width:100%;max-width:420px;background:var(--card);border-radius:22px;padding:26px 22px 22px;box-shadow:0 18px 50px rgba(19,33,49,.25)}
.logo{font-family:var(--display);font-weight:800;font-size:52px;letter-spacing:-.03em;line-height:1}
.pitch{font-size:17px;line-height:1.45;margin:12px 0 20px;max-width:30ch}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font:700 17px var(--ui);cursor:pointer;margin-top:10px;touch-action:manipulation}
.btn.pri{background:var(--ink);color:var(--sky)}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:16px;font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.big span{font-size:.4em;font-weight:500}
.sub{color:var(--muted);font-size:15px;margin:6px 0 16px}
.mini{display:grid;gap:3px;margin:4px 0 6px;width:max-content}
.mini i{width:18px;height:18px;border-radius:4px;display:block}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.shout{transition:none}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Tower building area. Drag to aim the block, release to drop it."></canvas>
<div class="hud">
  <div class="tag" id="tag">Tower #1<small id="tagSub">Today's blocks</small></div>
  <div class="height" id="hNow" aria-live="off">0.00<span>m</span></div>
  <div class="right"><div class="left" id="left">20<small>blocks left</small></div>
    <button class="iconbtn" id="sound" aria-label="Sound on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button></div>
</div>
<div class="bar">
  <div class="next"><canvas id="nextCv" width="128" height="104"></canvas>Next</div>
  <div class="hint" id="hint">Drag to aim, release to drop</div>
  <button class="rot" id="rot" aria-label="Rotate block"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
</div>
<div class="shout" id="shout"></div>

<div class="sheet on" id="menu" role="dialog" aria-label="Start">
  <div class="card">
    <div class="logo">TOPPLE</div>
    <p class="pitch">Everyone gets the same 20 blocks today. Build the tallest tower before it falls.</p>
    <div id="menuDone" hidden><div class="big" id="doneH">0.00<span>m</span></div><p class="sub" id="doneSub"></p></div>
    <button class="btn pri" id="playDaily">Build today's tower</button>
    <button class="btn sec" id="playPractice">Practice with random blocks</button>
    <div class="meta"><span id="streak"></span><span id="countdown"></span></div>
  </div>
</div>
<div class="sheet" id="end" role="dialog" aria-label="Result">
  <div class="card">
    <div class="sub" id="endTitle" style="margin:0 0 6px">Tower #1</div>
    <div class="big" id="endH">0.00<span>m</span></div>
    <p class="sub" id="endSub"></p>
    <div class="mini" id="mini" aria-hidden="true"></div>
    <button class="btn pri" id="share">Share result</button>
    <button class="btn sec" id="again">Practice with random blocks</button>
    <button class="btn sec" id="toMenu">Back</button>
  </div>
</div>

<script>/*__PLANCK__*/</script>
<script>/*__ENGINE__*/</script>
<script>
'use strict';
const E = window.ToppleEngine, $ = id => document.getElementById(id);
const cv = $('cv'), cx = cv.getContext('2d'), nx = $('nextCv').getContext('2d');
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };

/* ---- colours from CSS tokens (light sky or night sky) ---- */
let C = {};
function readTheme() {
  const s = getComputedStyle(document.documentElement), v = n => s.getPropertyValue(n).trim();
  C = { sky: v('--sky'), ink: v('--ink'), muted: v('--muted'), plat: v('--plat'), line: v('--line'), blocks: [v('--cobalt'), v('--sun'), v('--mint'), v('--violet')] };
}
readTheme();
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);

/* ---- sound: short wooden knocks, synthesised ---- */
let AC = null, soundOn = store.get('topple.sound') !== false, lastKnock = 0;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function knock(power, pitch) {
  if (!soundOn || !AC) return;
  const now = AC.currentTime;
  if (now - lastKnock < 0.045) return;
  lastKnock = now;
  const v = Math.min(1, power) * 0.5, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(pitch, now); o.frequency.exponentialRampToValueAtTime(pitch * 0.55, now + 0.09);
  g.gain.setValueAtTime(v, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
  o.connect(g).connect(AC.destination); o.start(now); o.stop(now + 0.13);
}
function whoosh() {
  if (!soundOn || !AC) return;
  const now = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(420, now); o.frequency.exponentialRampToValueAtTime(90, now + 0.45);
  g.gain.setValueAtTime(0.18, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
  o.connect(g).connect(AC.destination); o.start(now); o.stop(now + 0.5);
}
function setSoundIcon() { $('wave').style.display = soundOn ? '' : 'none'; $('sound').setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off'); }
setSoundIcon();
$('sound').addEventListener('click', () => { soundOn = !soundOn; store.set('topple.sound', soundOn); setSoundIcon(); audio(); });

/* ---- game state ---- */
const TODAY = E.dayIndex();
let g = null, mode = 'daily', state = 'menu', angle = 0, hx = 0, aiming = false, ready = false, readyAt = 0;
let settleT = 0, shake = 0, lostTimes = [], dropsDone = 0, simTime = 0, best = store.get('topple.best') || 0;
const READY_DELAY = 0.6;          // seconds before the next block can drop

function start(kind) {
  audio();
  mode = kind;
  const seed = kind === 'daily' ? E.daySeed(TODAY) : (Date.now() ^ (Math.random() * 1e9)) >>> 0;
  g = E.createGame(seed);
  g.world.on('post-solve', (contact, impulse) => {
    const p = impulse.normalImpulses[0] || 0;
    if (p > 0.6) { const m = (contact.getFixtureA().getBody().getMass() + contact.getFixtureB().getBody().getMass()) / 2; knock(p / 6, 520 / Math.sqrt(Math.max(0.2, m))); }
  });
  angle = 0; hx = 0; ready = true; readyAt = 0; settleT = 0; simTime = 0; lostTimes = []; dropsDone = 0;
  state = 'play';
  $('menu').classList.remove('on'); $('end').classList.remove('on');
  $('tag').firstChild.textContent = kind === 'daily' ? `Tower #${TODAY}` : 'Practice';
  $('tagSub').textContent = kind === 'daily' ? "Today's blocks" : 'Random blocks';
  $('hint').style.opacity = 1;
  updateHud(); drawNext();
}

function current() { return g && g.next < E.BLOCKS ? g.set[g.next] : null; }
function hoverY() { const e = E.extents(current(), angle); return E.height(g) - e.minY + E.GAP; }
function clampX(x) { const lim = E.PLAT_W / 2 + 1.4; return Math.max(-lim, Math.min(lim, x)); }

function dropNow() {
  if (state !== 'play' || !ready || !current()) return;
  E.drop(g, hx, hoverY(), angle);
  dropsDone++; ready = false; readyAt = simTime + READY_DELAY;
  if (dropsDone >= 2) $('hint').style.opacity = 0;
  if (g.next >= E.BLOCKS) { state = 'settle'; settleT = 0; }
  updateHud(); drawNext();
}
function rotate() { if (state === 'play') { angle = (angle + Math.PI / 4) % (Math.PI * 2); drawNext(); } }

/* ---- input ---- */
let cam = { s: 60, gy: 600 };
const toWorldX = px => (px - innerWidth / 2) / cam.s;
cv.addEventListener('pointerdown', e => { audio(); if (state !== 'play') return; aiming = true; hx = clampX(toWorldX(e.clientX)); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (aiming) hx = clampX(toWorldX(e.clientX)); });
cv.addEventListener('pointerup', () => { if (!aiming) return; aiming = false; dropNow(); });
cv.addEventListener('pointercancel', () => { aiming = false; });
$('rot').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); audio(); rotate(); });
addEventListener('keydown', e => {
  if (state !== 'play') return;
  if (e.key === 'ArrowLeft') hx = clampX(hx - 0.15);
  else if (e.key === 'ArrowRight') hx = clampX(hx + 0.15);
  else if (e.key === 'ArrowUp' || e.key === 'r' || e.key === 'R') rotate();
  else if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); dropNow(); }
  else return;
});

/* ---- simulation loop: fixed 120 Hz steps, drawn every frame ---- */
let last = 0, acc = 0, hShown = 0;
function frame(t) {
  const dt = Math.min(0.1, (t - (last || t)) / 1000); last = t;
  if (state === 'play' || state === 'settle') {
    acc += dt;
    let n = 0;
    while (acc >= E.DT && n < 12) {
      const lost = E.step(g); simTime += E.DT; acc -= E.DT; n++;
      if (lost.length) onLost(lost.length);
    }
    if (n === 12) acc = 0;
    if (!ready && state === 'play' && simTime >= readyAt) ready = true;
    if (state === 'settle') {
      settleT += dt;
      const left = Math.ceil(E.HOLD - settleT);
      shout(left > 0 ? String(left) : '', left > 0);
      if (settleT >= E.HOLD && (!E.moving(g) || settleT > E.HOLD + 5)) finish();
    }
    const h = E.height(g); hShown += (h - hShown) * 0.25;
    $('hNow').firstChild.textContent = hShown.toFixed(2);
  }
  shake *= 0.86;
  draw();
  requestAnimationFrame(frame);
}

let shoutT = 0;
function shout(text, on) { const el = $('shout'); if (el.textContent !== text) el.textContent = text; el.classList.toggle('on', !!on && !!text); }
function onLost(n) {
  whoosh();
  if (!reduceMotion) shake = Math.min(14, shake + 5 * n);
  if (navigator.vibrate) navigator.vibrate(18);
  const now = simTime; lostTimes.push(...Array(n).fill(now)); lostTimes = lostTimes.filter(x => now - x < 1.5);
  if (lostTimes.length >= 3 && state === 'play') { shout('TOPPLE!', true); clearTimeout(shoutT); shoutT = setTimeout(() => shout('', false), 1100); }
  updateHud();
}
function updateHud() {
  const left = g ? E.BLOCKS - g.next : E.BLOCKS;
  $('left').firstChild.textContent = String(left);
  $('left').lastChild.textContent = g && g.lost ? `${g.lost} fell off` : left === 1 ? 'block left' : 'blocks left';
}

/* ---- drawing ---- */
function blockPath(ctx, parts, x, y, a, s) {
  const c = Math.cos(a), sn = Math.sin(a);
  ctx.beginPath();
  for (const p of parts) {
    if (p.circle) { ctx.moveTo(x + p.circle * s, y); ctx.arc(x, y, p.circle * s, 0, Math.PI * 2); continue; }
    p.poly.forEach(([px, py], i) => { const wx = x + (px * c - py * sn) * s, wy = y - (px * sn + py * c) * s; i ? ctx.lineTo(wx, wy) : ctx.moveTo(wx, wy); });
    ctx.closePath();
  }
}
function paintBlock(ctx, block, x, y, a, s, alpha) {
  const parts = E.partsOf(block);
  ctx.globalAlpha = alpha;
  blockPath(ctx, parts, x, y, a, s);
  ctx.fillStyle = C.blocks[E.colorOf(block)]; ctx.fill();
  ctx.lineWidth = Math.max(1.5, s * 0.035); ctx.lineJoin = 'round'; ctx.strokeStyle = C.ink; ctx.stroke();
  if (parts[0].circle) {                                    // a spoke, so you can see the ball roll
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * parts[0].circle * s, y - Math.sin(a) * parts[0].circle * s); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function draw() {
  const W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.fillStyle = C.sky; cx.fillRect(0, 0, W, H);
  const top = g ? Math.max(E.height(g), state === 'play' && current() ? hoverY() + E.extents(current(), angle).maxY : 0) : 0;
  const gy = H - 150, viewH = Math.max(7.5, top + 2.5);
  const sTarget = Math.min(W / (E.PLAT_W + 3.4), (gy - 150) / viewH);
  cam.s += (sTarget - cam.s) * 0.08; cam.gy = gy;
  const s = cam.s, ox = W / 2 + (shake ? (Math.random() - 0.5) * shake : 0), oy = gy + (shake ? (Math.random() - 0.5) * shake * 0.6 : 0);
  const X = wx => ox + wx * s, Y = wy => oy - wy * s;

  // ruler
  const rx = W - 26;
  cx.strokeStyle = C.line; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(rx, Y(0)); cx.lineTo(rx, 0); cx.stroke();
  cx.fillStyle = C.muted; cx.font = '600 12px Figtree, system-ui, sans-serif'; cx.textAlign = 'right'; cx.textBaseline = 'middle';
  const stepM = s < 22 ? 2 : 1;
  for (let m = 0; Y(m) > 0; m += 0.5) {
    const major = Math.abs(m % stepM) < 1e-6;
    cx.beginPath(); cx.moveTo(rx, Y(m)); cx.lineTo(rx - (major ? 10 : 5), Y(m)); cx.stroke();
    if (major && m > 0) cx.fillText(`${m} m`, rx - 14, Y(m));
  }
  // best line (practice) and current height line
  if (mode === 'practice' && best > 0.5) dashed(Y(best), `best ${best.toFixed(2)}`, C.muted);
  if (g && E.height(g) > 0.05) dashed(Y(E.height(g)), '', C.ink);

  // platform and its pillar
  cx.fillStyle = C.plat;
  cx.fillRect(X(-0.7), Y(-0.5), 1.4 * s, H);
  cx.fillRect(X(-E.PLAT_W / 2), Y(0), E.PLAT_W * s, 0.5 * s);

  // blocks
  if (g) for (const b of g.bodies) { const p = b.getPosition(); paintBlock(cx, b.getUserData().block, X(p.x), Y(p.y), b.getAngle(), s, 1); }

  // the block you are aiming
  if (g && state === 'play' && current()) {
    const y = hoverY();
    cx.setLineDash([4, 6]); cx.strokeStyle = C.muted; cx.lineWidth = 1.5;
    cx.beginPath(); cx.moveTo(X(hx), Y(y + E.extents(current(), angle).minY)); cx.lineTo(X(hx), Y(E.height(g))); cx.stroke(); cx.setLineDash([]);
    paintBlock(cx, current(), X(hx), Y(y), angle, s, ready ? 1 : 0.35);
  }
}
function dashed(y, label, color) {
  cx.save(); cx.setLineDash([6, 6]); cx.strokeStyle = color; cx.globalAlpha = 0.5; cx.lineWidth = 1.5;
  cx.beginPath(); cx.moveTo(0, y); cx.lineTo(innerWidth - 30, y); cx.stroke(); cx.restore();
  if (label) { cx.fillStyle = color; cx.textAlign = 'left'; cx.fillText(label, 12, y - 10); }
}
function drawNext() {
  const c = nx.canvas; nx.clearRect(0, 0, c.width, c.height);
  const b = g && g.next + 1 < E.BLOCKS ? g.set[g.next + 1] : null;
  if (!b) return;
  const e = E.extents(b, 0), s = Math.min(100 / (e.maxX - e.minX), 80 / (e.maxY - e.minY), 60);
  paintBlock(nx, b, c.width / 2 - (e.maxX + e.minX) / 2 * s, c.height / 2 + (e.maxY + e.minY) / 2 * s, 0, s, 1);
}

/* ---- results, streaks and sharing ---- */
const EMOJI = ['🟦', '🟨', '🟩', '🟪'];
function finish() {
  state = 'end'; shout('', false);
  const h = E.height(g), standing = E.BLOCKS - g.lost, grid = E.grid(g);
  const result = { h: +h.toFixed(2), standing, grid };
  if (mode === 'daily') store.set('topple.d.' + TODAY, result);
  let newBest = false;
  if (mode !== 'daily' && result.h > best) { best = result.h; newBest = true; store.set('topple.best', best); }
  showEnd(result, mode === 'daily', newBest);
}
function showEnd(r, daily, newBest) {
  $('endTitle').textContent = daily ? `Tower #${TODAY}` : 'Practice tower';
  $('endH').firstChild.textContent = r.h.toFixed(2);
  $('endSub').textContent = `${r.standing} of ${E.BLOCKS} blocks still standing` + (daily ? '' : newBest ? '. New best.' : `. Your best is ${best.toFixed(2)} m.`);
  const mini = $('mini'); mini.innerHTML = '';
  mini.style.gridTemplateColumns = `repeat(${(r.grid[0] || []).length || 7}, 18px)`;
  for (const row of r.grid) for (const c of row) { const i = document.createElement('i'); i.style.background = c < 0 ? 'var(--line)' : C.blocks[c]; mini.appendChild(i); }
  $('share').hidden = !daily;
  $('end').classList.add('on');
}
function shareText(r) {
  const rows = r.grid.map(row => row.map(c => c < 0 ? '⬜' : EMOJI[c]).join(''));
  const url = location.href.split('#')[0];
  return `TOPPLE #${TODAY}: ${r.h.toFixed(2)} m\n${rows.join('\n')}\n${'🟫'.repeat((r.grid[0] || []).length || 7)}\n${r.standing}/${E.BLOCKS} blocks standing\n${url}`;
}
$('share').addEventListener('click', async () => {
  const r = store.get('topple.d.' + TODAY); if (!r) return;
  const text = shareText(r);
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toastShare('Result copied. Paste it anywhere.'); }
  catch (_) { toastShare('Copy blocked here. Long-press the result to copy it.'); }
});
function toastShare(msg) { $('endSub').textContent = msg; }
function streak() {
  let n = 0, d = store.get('topple.d.' + TODAY) ? TODAY : TODAY - 1;
  while (store.get('topple.d.' + d)) { n++; d--; }
  return n;
}
function showMenu() {
  state = 'menu'; $('end').classList.remove('on'); $('menu').classList.add('on');
  const done = store.get('topple.d.' + TODAY);
  $('menuDone').hidden = !done;
  $('playDaily').textContent = done ? 'See today’s result' : 'Build today’s tower';
  if (done) { $('doneH').firstChild.textContent = done.h.toFixed(2); $('doneSub').textContent = `Tower #${TODAY}, ${done.standing} of ${E.BLOCKS} blocks standing`; }
  const st = streak(); $('streak').textContent = st ? `${st}-day streak` : `Tower #${TODAY}`;
}
$('playDaily').addEventListener('click', () => { const done = store.get('topple.d.' + TODAY); if (done) { $('menu').classList.remove('on'); showEnd(done, true); } else start('daily'); });
$('playPractice').addEventListener('click', () => start('practice'));
$('again').addEventListener('click', () => start('practice'));
$('toMenu').addEventListener('click', showMenu);
setInterval(() => {
  const n = new Date(), mid = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1), s = Math.max(0, Math.floor((mid - n) / 1000));
  $('countdown').textContent = `Next tower in ${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}, 1000);

$('tag').firstChild.textContent = `Tower #${TODAY}`;
showMenu();
requestAnimationFrame(frame);
